name: Production health check

# Runs the full functional suite against the live site — this is what
# actually calls Claude through each demo endpoint, so it costs a small
# amount of real money per run. Scheduled daily rather than on every push.
# This is exactly the check that would have caught the 2026-07-27
# migration-assessment outage (Anthropic retired the model it called) —
# without it, the demo could silently sit broken indefinitely.

on:
  schedule:
    - cron: "0 13 * * *" # 6am PT / 1pm UTC, daily
  workflow_dispatch: {} # allow manual "run now" from the Actions tab

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 and this job installs
    # Playwright browsers with system deps. Re-test on 26 before unpinning.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_URL: https://tioga.ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Playwright's own apt install was slow and flaky on the runner mirror and hung
      # until the job limit (2026-10-05, 2026-10-07). Retry apt fetches cleanly, run the
      # system-deps install as its own capped step, and cache the browser download.
      # azure.archive.ubuntu.com (the runner default) stalled on 2026-10-07: 126 MB did not
      # finish in 8 minutes. Point apt at the main Ubuntu archive instead.
      - name: Configure apt (retries, main Ubuntu mirror)
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps chromium webkit
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: npx playwright install chromium webkit
      - name: Run full suite against production (structural + functional)
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-prod
          path: playwright-report/
          retention-days: 30

  # Failure alert: opens (or comments on) a GitHub issue so the failure reaches
  # an inbox. Runs after the test job even when it fails, times out or never
  # gets a runner (the 2026-10-05 case). Scheduled runs only, so manual runs
  # don't open issues. One open issue at a time: repeat failures add a comment.
  alert:
    needs: test
    if: always() && github.event_name == 'schedule' && needs.test.result != 'success'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.test.result }}
        run: |
          title="Production health check failing"
          body="Scheduled run ended with result: ${RESULT}. Run: ${RUN_URL}"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi
