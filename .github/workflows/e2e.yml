name: E2E (structural)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19. Re-test on 26 before unpinning.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (zero warnings allowed)
        run: npm run lint
      # Playwright's own apt install was slow and flaky on the runner mirror and hung
      # until the job limit (2026-10-05, 2026-10-07). Retry apt fetches cleanly, run the
      # system-deps install as its own capped step, and cache the browser download.
      - name: Configure apt retries
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps chromium webkit
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: npx playwright install chromium webkit
      - name: Run structural + accessibility tests (page loads, links, SEO, axe — no AI calls)
        run: npx playwright test tests/pages.spec.ts tests/a11y.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
