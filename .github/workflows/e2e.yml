name: E2E (structural)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19. Re-test on 26 before unpinning.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (zero warnings allowed)
        run: npm run lint
      # Same cap-and-retry as prod-health-check.yml: the install hung until the job limit.
      - name: Install Playwright browsers (capped, one retry)
        timeout-minutes: 9
        run: |
          for attempt in 1 2; do
            timeout 4m npx playwright install --with-deps chromium webkit && exit 0
            echo "Playwright install attempt $attempt failed or timed out"
          done
          exit 1
      - name: Run structural + accessibility tests (page loads, links, SEO, axe — no AI calls)
        run: npx playwright test tests/pages.spec.ts tests/a11y.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
